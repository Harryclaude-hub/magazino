name: Magazino veroeffentlichen

# Baut die App bei jedem Push auf main und legt sie auf GitHub Pages.
# Die Adressen stehen als Repository-Variablen (nur oeffentliche Werte, keine
# Geheimnisse), damit man das Supabase-Projekt wechseln kann, ohne etwas
# umzuschreiben.
#
# Sicherheit (das Repo ist oeffentlich, E108):
#  - Ausloeser nur Push auf main und Start von Hand: KEIN pull_request, damit
#    fremder Code aus Forks hier nie laeuft und nie Rechte bekommt.
#  - Keine Repository-Geheimnisse im Ablauf, nichts wird ausgegeben.
#  - Rechte je Auftrag so klein wie moeglich; Standard fuer alles ist nur Lesen.
#  - Alle Bausteine auf einen festen Stand (Pruefsumme) gesetzt, nicht auf ein
#    Versions-Etikett, das jemand verschieben koennte.
#  - Laeuft nur in diesem Repo, nicht in Kopien (Forks).
# Kosten: bei oeffentlichen Repos kostenlos. Notweg ohne Actions:
# `node scripts/veroeffentlichen.mjs` (siehe docs/GITHUB-KOSTEN-2026-11-20.md).

# STAND 20.11.2026: Solange GitHub das Konto wegen eines Abrechnungsproblems fuer Actions sperrt ("The job was not
# started because your account is locked due to a billing issue", gilt auch fuer oeffentliche Repos), laeuft dieser
# Ablauf nicht. Darum nur von Hand startbar; die Seite kommt ueber `node scripts/veroeffentlichen.mjs` (Zweig gh-pages,
# GitHubs eigener Pages-Schritt laeuft trotzdem). Ist die Abrechnung geklaert: den Block unten auf "push" erweitern und in
# den Pages-Einstellungen die Quelle wieder auf "GitHub Actions" stellen.
#   push:
#     branches: [main]
#     paths-ignore: ['docs/**', 'rework/**', 'supabase/**', 'scripts/**', '*.md']
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    if: github.repository == 'Harryclaude-hub/magazino'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Konfiguration pruefen
        # Fehlen die Variablen, baut Vite still eine App, die beim Start nur
        # den Hinweis auf die fehlende Konfiguration zeigt. Lieber hier laut
        # abbrechen als eine tote Seite veroeffentlichen.
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "VITE_SUPABASE_URL oder VITE_SUPABASE_ANON_KEY fehlt."
            echo "Unter Settings, Secrets and variables, Actions, Variables setzen."
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - name: Typen pruefen
        run: npx tsc -b

      - name: Bauen
        env:
          VITE_BASE: /magazino/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Rueckfall fuer tiefe Adressen
        # GitHub Pages kennt keine Umschreibung auf index.html. Ohne diese
        # Kopie liefert ein Aufruf von /magazino/app/scan einen 404 statt der App.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
